<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Fine-tune · AutoEdit</title>
<link rel="stylesheet" href="/app/editor_host.css">
<link rel="stylesheet" href="/app/editor_assist.css">
<script type="module" src="/app/editor_host.js"></script>
</head><body>
<header>
  <a class="tools" href="/#/editor">Back to Photo editor</a>
  <h1 id="filename">Fine-tune</h1>
  <button id="export" class="primary" disabled>Export</button>
</header>
<div id="filtered" hidden><span id="filtered-label"></span> <button id="all-photos">Show all photos</button></div>
<main>
  <iframe id="editor" title="LightCraft photo editor" hidden></iframe>
  <section id="boot" aria-label="Editor setup"><h2 id="boot-title">Opening photo editor…</h2>
    <p id="boot-message"></p><button id="install" class="primary" hidden>Download and open</button>
    <button id="retry" hidden>Try again</button></section>
</main>
<nav class="fine-tools" aria-label="Fine-tune tools">
  <button id="open" disabled>Open photo</button>
  <button id="detail" disabled>Inspect at 100%</button>
  <button id="compare" disabled>Before / After</button>
  <button id="ask-gemini" disabled>Ask Gemini</button>
  <button id="native" hidden>Open desktop editor</button>
</nav>
<div id="status" role="status" aria-live="polite"></div>
<dialog id="comparison" aria-labelledby="comparison-title">
  <div class="compare-top"><h2 id="comparison-title">Before and after</h2><button id="close">Back to editing</button></div>
  <div id="canvas-area"><div id="compare-pair" hidden>
    <canvas id="edited" aria-label="Edited photo"></canvas>
    <canvas id="before" aria-label="Original photo"></canvas>
    <span id="divider" aria-hidden="true"></span>
    <input id="wipe" type="range" min="0" max="100" value="50" aria-label="Original photo visible">
    <span class="side left">Original</span><span class="side right">Edited</span>
  </div><div id="compare-feedback"><p id="compare-status" role="status">Rendering comparison…</p>
    <button id="native-split" hidden>Use LightCraft split view</button></div></div>
</dialog>
</body></html>
