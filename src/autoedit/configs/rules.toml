# AutoEdit rules — stats -> per-region edit values (the rule BASELINE; the LLM refines on top).
#
# Sections are [scene.region]. region = "global" lands on the whole image; any other region
# name lands on that resolved mask. Each value is an expression evaluated by the sandboxed
# evaluator in src/autoedit/rules.py.
#
# Variables available in EVERY block (global stats):
#   mean_lum, mean_sat, shadow_clip, highlight_clip, haze, intensity
#   sky_lum, sky_sat, blown_sky, subj_lum, bg_lum   (0.0 when that concept is absent)
#   iso, exposure_ev                                (EXIF priors; 0.0 when the photo has no metadata)
# Variables ALSO available inside a non-global region block (about THAT region):
#   region_lum, region_sat, region_clip_low, region_clip_high, region_coverage,
#   region_vs_global_lum   (region_lum - mean_lum)
# Helpers: clamp(x, lo, hi), min, max, if(cond, a, b), abs, and the operators + - * / and comparisons.
#
# Units match the apply engine (src/autoedit/edit/ops.py):
#   exposure = stops (EV);  contrast/highlights/shadows/whites/blacks/clarity/vibrance/
#   saturation/dehaze = roughly [-100, 100];  temp/tint = white-balance units.
#
# TUNING NOTE: a RESTRAINED, true-to-life baseline (retuned v0.3) — bright and clean, NOT an
# HDR look. Principles: never force-darken a sky that isn't blown; recover highlights gently;
# open shadows only enough for detail; keep clarity/dehaze low (they cause grain/halos); keep
# black point shallow; modest vibrance (snow/skin protected from the global pass via the
# skin-safe guard, see [guard]). The look (looks.toml) + intensity scale it further; `punchy`/
# `dramatic` are the assertive opt-ins. If a result still looks heavy, lower --intensity.

# ─────────────────────────── skin-safe guard ───────────────────────────
# Global finishing ops that must NOT hit skin/face at full strength (pros reject over-clarified,
# over-saturated, colour-graded faces fastest). The pipeline applies the global pass everywhere,
# then over any region flagged `guard_global` in concepts.toml it re-applies the global WITHOUT
# these ops — so faces keep global exposure/tone/contrast but skip the aggressive look.
# This is data: edit the list to tune what's protected. Remove the block to fall back to defaults.
[guard]
ops = ["clarity", "saturation", "vibrance", "hsl_skin_sat",
       "grade_shadows_temp", "grade_shadows_tint", "grade_highlights_temp", "grade_highlights_tint"]
# Banding gate: detect posterization/contour lines in smooth regions (sky/mist/water) of the
# EDITED output, source-relative. Above `reduce_ops` the pipeline reduces the stretch ops
# (dehaze/contrast/curve/clarity) and re-applies once; `warning` just notes it. Remove this whole
# block to disable the gate. Scores ~0 clean … 1 severe.
[banding]
warning = 0.12
reduce_ops = 0.22
hard_fail = 0.35
min_coverage = 0.03

# Oversaturation gate (final safety pass): a pixel's colour may be at most this fraction more
# saturated than the source (0.30 = +30%). Snow/skin (guard_global) and near-white highlights
# are held far tighter. Set to "off" to disable. This is what keeps the result true-to-life.
max_chroma_increase = 0.30

# ─────────────────────────── people ───────────────────────────
[people.global]
exposure   = "clamp(-(mean_lum - 0.48) * 1.0, -0.10, 0.25)"
contrast   = "8"
highlights = "clamp(-highlight_clip * 85, -40, 0)"          # recover only a blown background
shadows    = "clamp(shadow_clip * 65 + 5, 5, 26)"
whites     = "clamp(3 - highlight_clip * 55, -16, 5)"
blacks     = "-3"
vibrance   = "4"
clarity    = "4"
sharpen    = "12 * (1 - min(iso, 6400) / 12800)"   # ease output sharpening as ISO (noise) rises

# protect skin: lift if underexposed, soften texture, a touch of warmth
[people.skin]
exposure   = "clamp(0.5 * max(0, mean_lum - region_lum), 0, 0.5)"
shadows    = "clamp(0.4 * max(0, mean_lum - region_lum) * 40, 0, 16)"
clarity    = "-5"
temp       = "4"
vibrance   = "4"

# subject: lift out of the background + sharpen
[people.subject]
exposure   = "clamp(0.5 * max(0, bg_lum - subj_lum) + 0.05, 0, 0.5)"
clarity    = "6"
contrast   = "4"
sharpen    = "16 * (1 - min(iso, 6400) / 12800)"

# ────────────────────────── landscape ─────────────────────────
[landscape.global]
# Bright + open + airy. Lift dark frames a lot; leave bright high-key frames bright (don't drag
# them toward mid — that killed the airy look). Asymmetric: lots of lift, almost no darkening.
exposure   = "clamp(-(mean_lum - 0.55) * 0.8, -0.04, 0.30)"
contrast   = "5"
# recover highlights for real clipping AND hold them back on already-bright frames, so a clean
# bright sky is never pushed INTO clipping. Never positive.
highlights = "clamp(-highlight_clip * 90 - max(0, mean_lum - 0.62) * 28, -42, 0)"
shadows    = "clamp(shadow_clip * 70 + 8, 8, 30)"            # open shadows so it never feels dark
whites     = "clamp(3 - highlight_clip * 60 - max(0, mean_lum - 0.62) * 42, -18, 5)"
blacks     = "0"                                             # no black crush — keep shadows alive
vibrance   = "4"
clarity    = "6"
# scale dehaze with actual haze, but keep the natural baseline gentle: smooth overcast skies
# posterize quickly when a dark-channel dehaze tries to "recover" fog that should stay soft.
dehaze     = "clamp((haze - 0.32) * 70, 0, 18)"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"

# the REAL sky: keep it natural-blue. Only darken if it's actually blown; never force-dim a
# good sky (that was the old 'too dark'). Avoid local texture/dehaze here: sky/mist masks are
# often coarse in smooth gradients, and localized tone changes imprint visible contour shapes.
# Global tone + the smooth sky_grad + auto palette carry the sky look without mask artifacts.
[landscape.sky]
exposure   = "0"
highlights = "0"
contrast   = "0"
clarity    = "0"
dehaze     = "0"
saturation = "if(region_sat > 0.7, -8, 3)"                   # tame already-saturated skies; tiny lift otherwise
temp       = "0"                                             # no cooling cast — keep the sky true
hsl_blue_sat = "3"

# dehaze + local contrast to define ridgelines — restrained so rock doesn't go gritty
[landscape.mountain]
dehaze     = "8"
clarity    = "12"
contrast   = "6"
shadows    = "6"
vibrance   = "5"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"

# recover snow texture (never flat white) — clean and neutral, low clarity so it isn't grainy.
# The skin-safe guard also holds the global vibrance/grade off snow (see [guard] + concepts.toml).
[landscape.snow]
exposure   = "clamp((0.74 - region_lum) * 0.35, -0.06, 0.14)"
highlights = "clamp(-region_clip_high * 55 - 12, -52, -8)"   # hold snow highlights, keep texture
whites     = "clamp(-region_clip_high * 45 - 4, -28, 4)"
clarity    = "8"
contrast   = "6"
temp       = "0"                                            # snow stays neutral white — no cast

# trees / bushes: healthy green, not neon
[landscape.foliage]
exposure   = "clamp((mean_lum - region_lum) * 0.3, -0.05, 0.16)"
vibrance   = "5"
saturation = "clamp((0.5 - region_sat) * 12, -4, 6)"
clarity    = "6"
hsl_green_sat = "4"
hsl_green_lum = "3"

# foreground grass: lifted out of the shadows, true green (no golden cast)
[landscape.grass]
exposure   = "clamp((mean_lum - region_lum) * 0.35, -0.04, 0.2)"
vibrance   = "5"
saturation = "4"
clarity    = "6"
temp       = "0"                                            # no warm cast — keep grass true
hsl_green_sat = "4"
hsl_green_lum = "3"

# water: gentle clarity, true color
[landscape.water]
exposure   = "0"
saturation = "3"
clarity    = "5"
dehaze     = "2"
temp       = "0"
hsl_blue_sat = "3"

# ─────────────────────────── other ────────────────────────────
[other.global]
exposure   = "clamp(-(mean_lum - 0.55) * 0.8, -0.04, 0.30)"
contrast   = "6"
highlights = "clamp(-highlight_clip * 90 - max(0, mean_lum - 0.62) * 28, -40, 0)"
shadows    = "clamp(shadow_clip * 65 + 8, 8, 28)"
whites     = "clamp(3 - highlight_clip * 55, -16, 5)"
blacks     = "0"
vibrance   = "4"
clarity    = "6"
dehaze     = "clamp((haze - 0.32) * 70, 0, 18)"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"

# subject (e.g. wildlife): lift + a little clarity for fur/feature detail
[other.subject]
exposure   = "clamp(0.4 * max(0, mean_lum - region_lum) + 0.04, 0, 0.4)"
clarity    = "8"
contrast   = "5"
shadows    = "6"
sharpen    = "16 * (1 - min(iso, 6400) / 12800)"
