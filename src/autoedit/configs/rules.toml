# AutoEdit rules — stats -> per-region edit values (the rule BASELINE; the LLM refines on top).
#
# Sections are [scene.region]. region = "global" lands on the whole image; any other region
# name lands on that resolved mask. Each value is an expression evaluated by the sandboxed
# evaluator in src/autoedit/rules.py.
#
# Variables available in EVERY block (global stats):
#   mean_lum, mean_sat, shadow_clip, highlight_clip, haze, intensity
#   r_shadow_clip, g_shadow_clip, b_shadow_clip, r_highlight_clip, g_highlight_clip, b_highlight_clip
#   r_highlight_recoverable, g_highlight_recoverable, b_highlight_recoverable
#   channel_shadow_clip, channel_highlight_clip, rgb_shadow_clip_any, rgb_shadow_clip_all
#   rgb_highlight_clip_any, rgb_highlight_clip_all, rgb_highlight_recoverable
#   sky_lum, sky_sat, blown_sky, subj_lum, subj_cov, bg_lum (0.0 when absent)
#   pro_stats_valid                                  (1 for freshly computed stats; 0 for legacy)
#   lum_p10, lum_p50, lum_p90, lum_p99, fg_lum, fg_p50, detail_rms, veil, dark_p10
#   headroom_ev  (stops before p99.5 of per-pixel max(R,G,B) clips — bounds exposure/contrast/whites)
#   planned_exposure  (this block's baseline exposure in EV after intensity; evaluated first)
#   dark_cov     (fraction of pixels with luma < 0.10: dark-but-unclipped, which shadow_clip can't see)
#   band_top_p50, band_mid_p50, band_bottom_p50     (median luma of the top/middle/bottom thirds)
#   snow_cov, sky_cov, water_cov, wb_temp_correction, wb_tint_correction, wb_confidence
#   iso, exposure_ev                                (EXIF priors; 0.0 when the photo has no metadata)
# Variables ALSO available inside a non-global region block (about THAT region):
#   region_lum, region_sat, region_clip_low, region_clip_high, region_coverage,
#   region_vs_global_lum   (region_lum - mean_lum)
#   region_r_shadow_clip, region_g_shadow_clip, region_b_shadow_clip
#   region_r_highlight_clip, region_g_highlight_clip, region_b_highlight_clip
#   region_channel_shadow_clip, region_channel_highlight_clip, region_rgb_highlight_recoverable
# Helpers: clamp(x, lo, hi), min, max, if(cond, a, b), abs, log2, log, and the operators + - * /
# and comparisons.
#
# Units match the apply engine (src/autoedit/edit/ops.py):
#   exposure = stops (EV);  contrast/highlights/shadows/whites/blacks/clarity/vibrance/
#   saturation/dehaze = roughly [-100, 100];  temp/tint = white-balance units.
#
# EXPOSURE IS LOGARITHMIC. Stops to move a gamma-encoded median m to target t are
#   EV = log2(lin(t)/lin(m)) ≈ 2.2 * log2(t / m)          (sRGB ≈ gamma 2.2)
# so the exposure rules below use `k * 2.2 * log2(target / stat)` with k the correction fraction
# (0.6 = lift 60% of the way), CAPPED BY `headroom_ev - 0.15` so a lift can never blow the highlights
# (the 0.15 EV margin keeps the 99.5th percentile off white once shadows/whites/sharpen add on top).
# The old form `-(fg_p50 - 0.50) * 0.9` treated a luma DIFFERENCE as stops: for fg_p50 = 0.17 it
# asked for 0.30 EV where ≈3.1 EV is the true deficit (a 10× under-correction on dark RAWs).
# Ops that pivot at mid-gray (contrast, blacks) are faded out on dark sources with
# `clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1)` — on a frame that sits entirely below the pivot they
# are pure darkening and were measured erasing the whole exposure lift.
# Global contrast also fades with `clamp(headroom_ev, 0, 1)`: full strength needs at least
# one stop of highlight headroom. Exposure alone cannot protect snow/clouds when the later
# contrast pass raises near-white pixels. This applies to every scene, including bright
# backgrounds in people photos; legacy stats retain their previous contrast.
#
# TUNING NOTE: a RESTRAINED, true-to-life baseline (retuned v0.3) — bright and clean, NOT an
# HDR look. Principles: never force-darken a sky that isn't blown; recover highlights gently;
# open shadows only enough for detail; keep clarity/dehaze low (they cause grain/halos); keep
# black point shallow; modest vibrance (snow/skin protected from the global pass via the
# skin-safe guard, see [guard]). The look (looks.toml) + intensity scale it further; `punchy`/
# `dramatic` are the assertive opt-ins. If a result still looks heavy, lower --intensity.

# Compatibility: omit zero-only automatic WB keys so a legacy/zero-filled stats model produces
# the same settings dictionary and sidecar shape as the pre-retune rules.
[compat]
omit_zero_global_ops = ["temp", "tint"]

# ─────────────────────────── skin-safe guard ───────────────────────────
# Global finishing ops that must NOT hit skin/face at full strength (pros reject over-clarified,
# over-saturated, colour-graded faces fastest). The pipeline applies the global pass everywhere,
# then over any region flagged `guard_global` in concepts.toml it re-applies the global WITHOUT
# these ops — so faces keep global exposure/tone/contrast but skip the aggressive look.
# This is data: edit the list to tune what's protected. Remove the block to fall back to defaults.
[guard]
ops = ["clarity", "saturation", "vibrance", "hsl_skin_sat",
       "grade_shadows_temp", "grade_shadows_tint", "grade_highlights_temp", "grade_highlights_tint"]
# Oversaturation gate (final safety pass): a pixel's colour may be at most this fraction more
# saturated than the source (0.30 = +30%). Snow/skin (guard_global) and near-white highlights
# are held far tighter. Set to "off" to disable. This is what keeps the result true-to-life.
# (Must live in THIS block — the engine reads guard.max_chroma_increase.)
max_chroma_increase = 0.30
# Banding gate: detect posterization/contour lines in smooth regions (sky/mist/water) of the
# EDITED output, source-relative. Above `reduce_ops` the pipeline reduces the stretch ops
# (dehaze/contrast/curve/clarity) and re-applies once; `warning` just notes it. Remove this whole
# block to disable the gate. Scores ~0 clean … 1 severe.
[banding]
warning = 0.12
reduce_ops = 0.22
hard_fail = 0.35
min_coverage = 0.03

# Post-edit quality gate (review queue): thresholds the safety assessment reads. Omitted keys
# use the built-in defaults (edit/gates.py GATE_DEFAULTS):
#   highlight_clip = 0.02   # post-edit highlight clipping above this → warn + score penalty
#   shadow_clip = 0.06      # post-edit shadow clipping above this → warn + score penalty
#   sat_delta = 0.10        # mean saturation rise vs source above this → warn + score penalty
#   review_score = 0.85     # quality score below this → needs review
#   review_highlight = 0.05 # hard review triggers regardless of score
#   review_shadow = 0.12
[quality_gate]
# Added clipping is a hard review trigger, even below the absolute warning thresholds. Uses
# the tone report's 0.5% budget; also checks the fraction clipping any RGB channel.
clip_budget = 0.005
clip_penalty = 0.25
# Darkness regression (source-relative): a source whose foreground / bottom-band median is below
# `dark_source` must not come out more than `dark_regress` darker → warning + review. Never an
# absolute brightness target, so night frames left alone pass. A prompt containing any of
# `preserve_terms` opts the photo out (the user asked for dark).
dark_source = 0.30
dark_regress = 0.01
preserve_terms = ["moody", "dark", "night", "low key", "low-key", "silhouette", "preserve exposure", "keep exposure"]

# ─────────────────────────── people ───────────────────────────
[people.global]
# EV-correct lift toward a 0.45 foreground median (60% of the deficit), never past the highlight
# headroom; legacy mean_lum form when the pro stats are absent.
exposure   = "if(pro_stats_valid > 0, clamp(0.6 * 2.2 * log2(0.45 / max(fg_p50, 0.02)), -0.10, min(0.8, max(0, headroom_ev - 0.15) + 0.3 * clamp((0.9 - headroom_ev) / 0.9, 0, 1))), clamp(-(mean_lum - 0.48) * 1.0, -0.10, 0.25))"
# Highlight knee (edit/ops.py highlight_rolloff): a soft shoulder in linear light that lets the lift
# above go ~0.3 EV past the clip headroom without clipping — the camera-curve behaviour a bare
# multiply lacks (RAW benchmark: matching the camera median by exposure alone clipped 70% of
# files). Strength rises as headroom vanishes; 0 on frames with ≥ 0.9 EV of room.
highlight_rolloff = "if(pro_stats_valid > 0, clamp((0.9 - headroom_ev) * 45, 0, 40), 0)"
contrast   = "if(pro_stats_valid > 0, 8 * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1) * clamp(headroom_ev, 0, 1), 8)"
highlights = "clamp(-max(highlight_clip, channel_highlight_clip) * 85, -40, 0)" # recover blown/channel-clipped background
# open shadows for DARKNESS (foreground median, dark coverage), not only for clipped pixels
shadows    = "clamp(shadow_clip * 65 + 5 + if(pro_stats_valid > 0, max(0, 0.35 - fg_p50) * 80 + dark_cov * 30, 0), 5, 40)"
# Both white-point lifts share the headroom left after exposure; negative recovery stays.
whites     = "min(clamp(3 - max(highlight_clip, channel_highlight_clip) * 55, -16, 5), 0) + (max(clamp(3 - max(highlight_clip, channel_highlight_clip) * 55, -16, 5), 0) + if(pro_stats_valid > 0, clamp((0.82 - lum_p90) * 40, 0, 8), 0)) * if(pro_stats_valid > 0, clamp((headroom_ev - max(0, planned_exposure) - 0.15) / 0.30, 0, 1), 1)"
blacks     = "if(pro_stats_valid > 0, -3 * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1), -3)"
vibrance   = "4"
clarity    = "4"
sharpen    = "12 * (1 - min(iso, 6400) / 12800)"   # ease output sharpening as ISO (noise) rises

# protect skin: lift if underexposed, soften texture, a touch of warmth
[people.skin]
exposure   = "clamp(0.5 * max(0, mean_lum - region_lum), 0, 0.5)"
shadows    = "clamp(0.4 * max(0, mean_lum - region_lum) * 40, 0, 16)"
clarity    = "-5"
temp       = "4"
vibrance   = "4"

# subject: lift out of the background + sharpen
[people.subject]
exposure   = "clamp(0.5 * max(0, bg_lum - subj_lum) + 0.05, 0, 0.5)"
clarity    = "6"
contrast   = "4"
sharpen    = "16 * (1 - min(iso, 6400) / 12800)"

# ────────────────────────── landscape ─────────────────────────
# SYNC NOTE: `blacks`, `vibrance`, `dehaze`, `clarity`, `sharpen`, `temp`, `tint` are copy-pasted
# byte-for-byte with [other.global] below (this TOML schema has no block-inheritance mechanism —
# `rules.py::apply()`'s scene fallback is whole-table, not per-key, so partial sharing isn't
# currently expressible). A change to any of those 7 keys here almost certainly belongs in
# [other.global] too — check both before assuming you're done.
[landscape.global]
# PRO TONE (v0.4, "visibly finished"): expose for the LAND, not the sky-skewed mean; set a
# deliberate black point on washed files; adapt contrast/clarity to the measured spread/softness.
# Every pro-stat expression is guarded by `pro_stats_valid`, so zero-filled older sidecars and
# hand-built tests reproduce the previous behavior even when a real measured value can equal zero.
#
# Expose for the foreground median (sky-excluded): calibrated on the Dolomites corpora, fg_p50
# sits ~0.26-0.29 while mean_lum reads ~0.5-0.6 — the sky was masking a dark subject.
# EV-CORRECT (see header): 60% of log2 deficit to a 0.45 median, capped by highlight headroom so
# a bright sky/snow frame gets ~0 global lift and the dark valley is left to shadows/regions.
exposure   = "if(pro_stats_valid > 0, clamp(0.6 * 2.2 * log2(0.45 / max(fg_p50, 0.02)), -0.06, min(1.0, max(0, headroom_ev - 0.15) + 0.3 * clamp((0.9 - headroom_ev) / 0.9, 0, 1))), clamp(-(mean_lum - 0.55) * 0.8, -0.04, 0.30))"
# Highlight knee (edit/ops.py highlight_rolloff): a soft shoulder in linear light that lets the lift
# above go ~0.3 EV past the clip headroom without clipping — the camera-curve behaviour a bare
# multiply lacks (RAW benchmark: matching the camera median by exposure alone clipped 70% of
# files). Strength rises as headroom vanishes; 0 on frames with ≥ 0.9 EV of room.
highlight_rolloff = "if(pro_stats_valid > 0, clamp((0.9 - headroom_ev) * 45, 0, 40), 0)"
# Adaptive contrast from the tonal spread: flat frames (p90-p10 ~0.25) get decisive contrast,
# already-contrasty alpine frames (~0.87) start at a gentle 3. Faded to 0 on dark sources
# (contrast pivots at 0.5), and scaled by highlight headroom to preserve snow/cloud detail.
contrast   = "if(pro_stats_valid > 0, clamp(3 + (0.60 - (lum_p90 - lum_p10)) * 40, 3, 16) * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1) * clamp(headroom_ev, 0, 1), 5)"
# recover highlights for real clipping AND hold them back on already-bright frames, so a clean
# bright sky is never pushed INTO clipping. Never positive.
highlights = "clamp(-max(highlight_clip, channel_highlight_clip) * 90 - max(0, mean_lum - 0.62) * 28, -42, 0)"
# open shadows so it never feels dark; a snow-dominant frame (snow_cov>0.2) gets a touch more lift
# — alpine shadow detail (rock/texture under snow) reads flatter than a typical landscape shadow.
# Sub-scene branching via a stat, not a new scene class — no rule-table duplication.
# DARKNESS, not just clipping: shadow_clip counts luma < 0.02 and reads ~0 on a frame whose
# foreground median is 0.17 with a quarter of its pixels below 0.10 — so the lift also scales
# with the foreground-median deficit and the dark-pixel coverage.
shadows    = "clamp(shadow_clip * 70 + 8 + if(pro_stats_valid > 0, if(snow_cov > 0.2, 3, 0) + max(0, 0.35 - fg_p50) * 90 + dark_cov * 40, 0), 8, 45)"
# white point: the old clip-guard PLUS a dull-highlight lift when p90 never reaches bright
# (washed/overcast files get their whites placed deliberately — the "finished" look). The lift
# fades out as highlight headroom vanishes, including the positive base term. Negative recovery
# remains intact. Deduct planned exposure: a modest p90 does not mean the near-white RGB tail
# still has room after the earlier lift. Negative exposure is not credited as extra white lift.
whites     = "min(clamp(3 - max(highlight_clip, channel_highlight_clip) * 60 - max(0, mean_lum - 0.62) * 42, -18, 5), 0) + (max(clamp(3 - max(highlight_clip, channel_highlight_clip) * 60 - max(0, mean_lum - 0.62) * 42, -18, 5), 0) + if(pro_stats_valid > 0, clamp((0.82 - lum_p90) * 50, 0, 10), 0)) * if(pro_stats_valid > 0, clamp((headroom_ev - max(0, planned_exposure) - 0.15) / 0.30, 0, 1), 1)"
# black point: deepen washed files toward a true black (never lifts — shadows does the lifting).
# The haze factor backs off when dehaze is already working (dehaze deepens blacks too).
blacks     = "if(pro_stats_valid > 0, clamp((0.055 - lum_p10) * 180, -18, 0) * (1 - 0.6 * clamp((haze - 0.32) * 2.8, 0, 1)) * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1), 0)"
vibrance   = "4"
# Adaptive clarity: soft frames (low measured detail) get more local contrast, already-crisp
# frames get less (they were previously over-clarified at a constant 6).
clarity    = "if(pro_stats_valid > 0, clamp(4 + (0.035 - detail_rms) * 250, 3, 12), 6)"
# scale dehaze with actual haze, but keep the natural baseline gentle: smooth overcast skies
# posterize quickly when a dark-channel dehaze tries to "recover" fog that should stay soft.
# (Deliberately kept on `haze`, not `veil`: blind-tested — dark-channel dehaze WON on bright
# veiling glare that veil can't see without also firing on snow; the in-op fragile-region taper
# + banding/chroma gates protect the smooth bright areas.)
dehaze     = "clamp((haze - 0.32) * 70, 0, 18)"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"
# Region-aware auto white balance: partial correction of the cast measured on a natural gray
# card (SAM snow region, else bright neutrals), scaled by confidence. ASYMMETRIC and
# warmth-preserving: blue/overcast casts are neutralized assertively (up to +12 warm), but a
# scene that measures warm keeps its light — golden hour is a subject, not a cast (the
# 1 - warmth/0.035 factor fades the correction to zero as measured warmth rises, and cooling
# is floored at -5 no matter what the card says).
temp       = "if(pro_stats_valid > 0, clamp(wb_temp_correction * 0.45 * wb_confidence * clamp(1 - max(0, warmth) / 0.035, 0, 1), -5 / max(1, intensity), 12 / max(1, intensity)), 0)"
tint       = "if(pro_stats_valid > 0, clamp(wb_tint_correction * 0.4 * wb_confidence, -6 / max(1, intensity), 6 / max(1, intensity)), 0)"

# the REAL sky: keep it natural-blue. Only darken if it's actually blown; never force-dim a
# good sky (that was the old 'too dark'). Avoid local texture/dehaze here: sky/mist masks are
# often coarse in smooth gradients, and localized tone changes imprint visible contour shapes.
# Global tone + the smooth sky_grad + auto palette carry the sky look without mask artifacts.
[landscape.sky]
exposure   = "0"
highlights = "0"
contrast   = "0"
clarity    = "0"
dehaze     = "0"
saturation = "if(region_sat > 0.7, -8, 3)"                   # tame already-saturated skies; tiny lift otherwise
temp       = "0"                                             # no cooling cast — keep the sky true
hsl_blue_sat = "3"

# dehaze + local contrast to define ridgelines — restrained so rock doesn't go gritty
[landscape.mountain]
# lift a mountain that sits below the foreground median (EV-correct, RELATIVE to fg_p50 so it
# composes with the global lift instead of double-counting the same deficit)
exposure   = "if(pro_stats_valid > 0, clamp(0.5 * 2.2 * log2(max(fg_p50, 0.02) / max(region_lum, 0.02)), -0.05, 0.5), 0)"
dehaze     = "8"
clarity    = "12"
contrast   = "6"
shadows    = "clamp(6 + if(pro_stats_valid > 0, max(0, 0.30 - region_lum) * 80, 0), 6, 30)"
vibrance   = "5"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"

# recover snow texture (never flat white) — clean and neutral, low clarity so it isn't grainy.
# The skin-safe guard also holds the global vibrance/grade off snow (see [guard] + concepts.toml).
[landscape.snow]
exposure   = "clamp((0.74 - region_lum) * 0.35, -0.06, 0.14)"
highlights = "clamp(-max(region_clip_high, region_channel_highlight_clip) * 55 - 12, -52, -8)" # hold snow highlights, keep texture
whites     = "clamp(-max(region_clip_high, region_channel_highlight_clip) * 45 - 4, -28, 4)"
clarity    = "8"
contrast   = "6"
temp       = "0"                                            # snow stays neutral white — no cast

# trees / bushes: healthy green, not neon
[landscape.foliage]
exposure   = "if(pro_stats_valid > 0, clamp(0.5 * 2.2 * log2(max(fg_p50, 0.02) / max(region_lum, 0.02)), -0.05, 0.5), clamp((mean_lum - region_lum) * 0.3, -0.05, 0.16))"
vibrance   = "5"
saturation = "clamp((0.5 - region_sat) * 12, -4, 6)"
clarity    = "6"
hsl_green_sat = "4"
hsl_green_lum = "3"

# foreground grass: lifted out of the shadows, true green (no golden cast)
[landscape.grass]
exposure   = "if(pro_stats_valid > 0, clamp(0.5 * 2.2 * log2(max(fg_p50, 0.02) / max(region_lum, 0.02)), -0.04, 0.5), clamp((mean_lum - region_lum) * 0.35, -0.04, 0.2))"
vibrance   = "5"
saturation = "4"
clarity    = "6"
temp       = "0"                                            # no warm cast — keep grass true
hsl_green_sat = "4"
hsl_green_lum = "3"

# water: gentle clarity, true color
[landscape.water]
exposure   = "0"
saturation = "3"
clarity    = "5"
dehaze     = "2"
temp       = "0"
hsl_blue_sat = "3"

# ─────────────────────────── other ────────────────────────────
[other.global]
# mirrors landscape's pro-tone policy (same availability guard); see comments there.
# SYNC NOTE: `blacks`, `vibrance`, `dehaze`, `clarity`, `sharpen`, `temp`, `tint` below are
# byte-for-byte copies of [landscape.global] — see that block's sync note before changing any of
# these 7 keys in only one place.
# Exposure priority: expose for the SUBJECT first (wildlife — a dark eagle against a bright sky
# must not be judged by the sky), else the sky-excluded foreground, else the legacy mean.
exposure   = "if(pro_stats_valid > 0, if(subj_cov > 0, clamp(0.6 * 2.2 * log2(0.45 / max(subj_lum, 0.02)), -0.15, min(1.0, max(0, headroom_ev - 0.15) + 0.3 * clamp((0.9 - headroom_ev) / 0.9, 0, 1))), clamp(0.6 * 2.2 * log2(0.45 / max(fg_p50, 0.02)), -0.06, min(1.0, max(0, headroom_ev - 0.15) + 0.3 * clamp((0.9 - headroom_ev) / 0.9, 0, 1)))), clamp(-(mean_lum - 0.55) * 0.8, -0.04, 0.30))"
# Highlight knee (edit/ops.py highlight_rolloff): a soft shoulder in linear light that lets the lift
# above go ~0.3 EV past the clip headroom without clipping — the camera-curve behaviour a bare
# multiply lacks (RAW benchmark: matching the camera median by exposure alone clipped 70% of
# files). Strength rises as headroom vanishes; 0 on frames with ≥ 0.9 EV of room.
highlight_rolloff = "if(pro_stats_valid > 0, clamp((0.9 - headroom_ev) * 45, 0, 40), 0)"
contrast   = "if(pro_stats_valid > 0, clamp(3 + (0.60 - (lum_p90 - lum_p10)) * 40, 3, 16) * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1) * clamp(headroom_ev, 0, 1), 6)"
highlights = "clamp(-max(highlight_clip, channel_highlight_clip) * 90 - max(0, mean_lum - 0.62) * 28, -40, 0)"
shadows    = "clamp(shadow_clip * 65 + 8 + if(pro_stats_valid > 0, max(0, 0.35 - fg_p50) * 90 + dark_cov * 40, 0), 8, 45)"
whites     = "min(clamp(3 - max(highlight_clip, channel_highlight_clip) * 55, -16, 5), 0) + (max(clamp(3 - max(highlight_clip, channel_highlight_clip) * 55, -16, 5), 0) + if(pro_stats_valid > 0, clamp((0.82 - lum_p90) * 50, 0, 10), 0)) * if(pro_stats_valid > 0, clamp((headroom_ev - max(0, planned_exposure) - 0.15) / 0.30, 0, 1), 1)"
blacks     = "if(pro_stats_valid > 0, clamp((0.055 - lum_p10) * 180, -18, 0) * (1 - 0.6 * clamp((haze - 0.32) * 2.8, 0, 1)) * clamp((if(band_bottom_p50 > 0, min(fg_p50, band_bottom_p50 + 0.12), fg_p50) - 0.20) / 0.15, 0, 1), 0)"
vibrance   = "4"
clarity    = "if(pro_stats_valid > 0, clamp(4 + (0.035 - detail_rms) * 250, 3, 12), 6)"
dehaze     = "clamp((haze - 0.32) * 70, 0, 18)"
sharpen    = "14 * (1 - min(iso, 6400) / 12800)"
temp       = "if(pro_stats_valid > 0, clamp(wb_temp_correction * 0.45 * wb_confidence * clamp(1 - max(0, warmth) / 0.035, 0, 1), -5 / max(1, intensity), 12 / max(1, intensity)), 0)"
tint       = "if(pro_stats_valid > 0, clamp(wb_tint_correction * 0.4 * wb_confidence, -6 / max(1, intensity), 6 / max(1, intensity)), 0)"

# subject (e.g. wildlife): lift + a little clarity for fur/feature detail
[other.subject]
exposure   = "clamp(0.4 * max(0, mean_lum - region_lum) + 0.04, 0, 0.4)"
clarity    = "8"
contrast   = "5"
shadows    = "6"
sharpen    = "16 * (1 - min(iso, 6400) / 12800)"
