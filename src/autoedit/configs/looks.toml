# AutoEdit looks — magnitude shaping over the rule baseline. A look never adds new
# decisions; it scales/offsets existing ones, then everything is scaled by intensity.
# Fields (all optional, neutral defaults):
#   contrast_mul, vibrance_add, saturation_add, clarity_mul, dehaze_mul
# saturation_add is a uniform global lift (vibrance protects already-saturated pixels; this
# doesn't) — global-only, so the skin-safe guard holds it off faces.
# Global-only finishing the look injects (applied once, to the whole image):
#   curve_add (filmic S-curve), grade_{shadows,highlights}_{temp,tint} (split-tone)

# the default — TRUE-TO-LIFE: tonal correction only, NO color styling. No split-tone grade
# (that reads as a teal/orange cast), no vibrance lift, clarity pulled down. Just a whisper of
# filmic contrast. Color stays honest; the chroma gate (rules.toml [guard]) backstops any
# oversaturation. If you want a graded/punchy look, that's the `punchy`/`dramatic` styles.
[natural]
contrast_mul = 1.0
vibrance_add = 0.0
clarity_mul  = 0.7          # pull clarity DOWN → kills the gritty/grainy micro-contrast
dehaze_mul   = 0.8
curve_add    = 5.0          # confident filmic contrast ("visibly finished") — curve is luma-only,
#                             so unlike `contrast` it adds punch without a saturation side-effect
# (no grade_* — natural does not tint shadows or highlights)

[punchy]
contrast_mul = 1.4
vibrance_add = 8.0
saturation_add = 6.0         # commits to colour (vibrance alone barely moves a colourful scene)
clarity_mul  = 1.3
dehaze_mul   = 1.4
curve_add    = 12.0          # crisper filmic contrast
grade_shadows_temp = -6.0    # cool shadows → editorial separation
grade_highlights_temp = 3.0

[soft_portrait]
contrast_mul = 0.8
vibrance_add = 0.0
clarity_mul  = 0.6
dehaze_mul   = 1.0
curve_add    = -4.0          # gentle, soft rolloff
grade_shadows_temp = -4.0    # teal-and-orange warm film: cool shadows...
grade_highlights_temp = 10.0 # ...warm highlights
grade_highlights_tint = 2.0

# bold cinematic: strong contrast/clarity/dehaze + a deep teal-orange split-tone.
# This is the assertive opt-in — it COMMITS (the chroma gate in rules.toml still backstops runaway
# saturation, and the skin-safe guard holds the global saturation/grade off faces).
[dramatic]
contrast_mul = 1.6
vibrance_add = 14.0
saturation_add = 12.0        # the lever that makes 'dramatic' actually vibrant, not just contrasty
clarity_mul  = 1.7
dehaze_mul   = 1.8
curve_add    = 20.0           # punchy filmic S-curve
grade_shadows_temp = -12.0    # cool/teal shadows
grade_shadows_tint = 4.0      # nudge shadows toward teal
grade_highlights_temp = 11.0  # warmer, more golden highlights
grade_highlights_tint = 2.0   # a touch of gold in the highlights

# calibrated from eval_3way: old Gemini's mood without its heavy teal/cyan cast or
# generated-looking saturation. This is meant to be paired with strict preservation.
[cinematic_preserved]
contrast_mul = 1.35
vibrance_add = 11.0
saturation_add = 4.0
clarity_mul  = 1.45
dehaze_mul   = 1.45
curve_add    = 11.0
grade_shadows_temp = -3.0
grade_shadows_tint = 1.0
grade_highlights_temp = 4.0
grade_highlights_tint = 1.0
