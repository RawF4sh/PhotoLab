# AutoEdit styles — selectable, user-facing looks. A style bundles:
#   look     -> which looks.toml magnitude profile shapes the rule output
#   concepts -> the default open-vocab concept set to segment (overridable by --concepts/--preset)
#   brief    -> a baked natural-language intent, combined with the user's --prompt and sent to
#               the LLM decider (steers the per-region deltas; ignored by the pure-rules path)
#
# Pick one with `--style NAME`; add `--prompt "..."` to layer your own intent on top.

[natural]
look = "natural"
# broad set so the DEFAULT adapts to any scene: landscapes get sky/mountain/snow/grass/water,
# portraits get skin/subject. Scene classification + per-region rules do the rest.
concepts = ["sky", "mountain", "snow", "grass", "water", "skin", "subject"]
brief = "clean, true-to-life color, balanced exposure, recover highlights, deepen the sky, open shadows for detail, protect skin tones"

[editorial]
look = "punchy"
concepts = ["subject", "sky", "skin", "background"]
brief = "high-contrast editorial look, deep shadows, crisp subject separation, slightly cool background, punchy but not garish"

[warm_film]
look = "soft_portrait"
concepts = ["subject", "sky", "skin", "foliage"]
brief = "warm filmic tones, soft contrast, gentle highlight rolloff, golden skin, muted greens"

[dramatic]
look = "dramatic"
concepts = ["sky", "mountain", "snow", "grass", "trees", "water", "rock"]
brief = "bold cinematic landscape: deep dramatic sky, dehazed mountains, crisp bright snow, lush warm-green foreground, teal-orange grade, rich contrast"

[cinematic_preserved]
look = "cinematic_preserved"
concepts = ["sky", "mountain", "snow", "grass", "trees", "water", "rock", "subject"]
brief = "old-cinematic mood with strict Lightroom preservation: dramatic alpine depth, darker sky, strong mountain separation, natural greens, restrained cyan, no generated content"
