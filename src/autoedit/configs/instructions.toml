# AutoEdit instructions: plain-language region edits ("brighten the jacket"), parsed locally by
# src/autoedit/instructions.py. This is data: add a verb or a word here, not in code.
#
# [verbs.NAME]  words = every surface form that selects the verb. place = the place a clause with
#               this verb and no target of its own aims at. The other keys are op deltas at amount
#               1.0, in the apply engine's units (exposure in EV, the rest about -100..100).
# [places.NAME] a part of the frame (F18), not an object: words = every surface form, shape =
#               gradient (angle, start, end) | oval (cx, cy, rx, ry, feather) | oval_outside
#               (the same, a vignette) | glow (radius_scale, min_radius: a round light on the
#               light the finder located). A place is one target per clause, never mixed with an
#               object; it is blended on its own, like a vignette. Where it lies on skin or snow
#               that the run found, that part gets the change after their policy ([shapes] guard).
# [sizes]       words that scale the extent of the place of their clause (a place only).
# [amounts]     words that scale the deltas of their clause.
# [limits]      ceiling (absolute value) for the SUM of instruction deltas on one target, per op.
# [target]      gating for an instructed concept that has no [concept.X] entry in concepts.toml,
#               and the smallest overlap, as a fraction of the frame, that becomes its own cell.
# [policy]      target word -> protected concept whose region policy it obeys.
# [marks]       an oval the user drew (F37): a sentence that names a thing edits that thing inside the
#               oval, any other sentence edits the oval itself. Gates and words for the reader.
# [shapes]      guard: skin and snow keep their limits inside a shape layer made by an instruction.
# [parser]      separators, joiners, determiners, ignored words, words that reject a clause,
#               words that mean the whole photo, and target length limits.
#
# An instruction is added on top of the rule baseline and is not scaled by --intensity. Region
# policies in concepts.toml (forbidden ops, caps) still apply to the sum.

[verbs.brighten]
words = ["brighten", "brighter", "lighten", "lighter", "lift"]
exposure = 0.30

[verbs.darken]
words = ["darken", "darker", "dim", "dimmer"]
exposure = -0.30

[verbs.warm]
words = ["warm", "warmer", "warm up"]
temp = 10

[verbs.cool]
words = ["cool", "cooler", "cool down"]
temp = -10

[verbs.saturate]
words = ["saturate", "more saturated", "more colorful", "more colourful", "more vivid"]
saturation = 12

[verbs.mute]
words = ["mute", "muted", "more muted", "desaturate", "less saturated", "less colorful", "less colourful"]
saturation = -14

[verbs.soften]
words = ["soften", "softer", "smooth", "smoother"]
clarity = -12
contrast = -6

[verbs.deepen]
words = ["deepen", "deeper", "richer"]
exposure = -0.12
contrast = 8
saturation = 6

[verbs.glow]
words = ["glow", "add a glow", "add glow", "warm glow", "add a warm glow", "sun glow"]
place = "light"
exposure = 0.15
temp = 8

[verbs.vignette]
words = ["vignette", "add a vignette"]
place = "edges"
exposure = -0.25

# Colour verbs. tint is positive toward GREEN (edit/ops.py), so pink and purple are negative.
# Amount 1.0 moves the strongest channel by about 6 to 10 levels of 255 on a blue sky and a grey.
[verbs.pink]
words = ["pink", "pinker", "rosy", "rosier", "magenta", "more pink"]
tint = -100
temp = 8

[verbs.purple]
words = ["purple", "purpler", "violet", "more purple"]
tint = -90
temp = -10

[verbs.golden]
words = ["golden", "gold", "more golden"]
temp = 50
tint = 6

[verbs.teal]
words = ["teal", "cyan", "more teal"]
temp = -20
tint = 100

[verbs.green]
words = ["greener", "more green"]
tint = 100

[verbs.blue]
words = ["bluer", "more blue"]
temp = -50

# Grain (F23) is for the whole photo. Aimed at a part of it, the clause is not understood.
[verbs.grain]
words = ["grain", "grainy", "grainier", "add grain", "more grain", "some grain", "film grain", "a grainy look"]
grain = 25

[places.top]
words = ["top", "upper part", "upper half", "sky side"]
shape = "gradient"
angle = 0
start = 0.0
end = 0.45

[places.bottom]
words = ["bottom", "lower part", "lower half"]
shape = "gradient"
angle = 180
start = 0.0
end = 0.45

[places.left]
words = ["left", "left side", "left half"]
shape = "gradient"
angle = 270
start = 0.0
end = 0.45

[places.right]
words = ["right", "right side", "right half"]
shape = "gradient"
angle = 90
start = 0.0
end = 0.45

[places.center]
words = ["center", "centre", "middle"]
shape = "oval"
cx = 0.5
cy = 0.5
rx = 0.32
ry = 0.36
feather = 0.45

[places.edges]
words = ["edges", "corners", "sides", "border", "outside"]
shape = "oval_outside"
cx = 0.5
cy = 0.5
rx = 0.55
ry = 0.55
feather = 0.5

[places.light]
words = ["sun", "sunlight", "light source", "where the sun is", "where the light comes from"]
shape = "glow"
radius_scale = 4.0
min_radius = 0.08

[sizes]
# Scale a place's extent (a gradient's reach, an oval's radii, a glow's radius). One per clause.
"bigger" = 1.5
"larger" = 1.5
"wider" = 1.5
"longer" = 1.5
"taller" = 1.5
"huge" = 2.0
"smaller" = 0.67
"narrower" = 0.67
"shorter" = 0.67
"tighter" = 0.67
"tiny" = 0.5

[amounts]
"slightly" = 0.5
"subtly" = 0.5
"gently" = 0.5
"a little" = 0.5
"a bit" = 0.5
"a touch" = 0.5
"somewhat" = 0.75
"more" = 1.3
"much" = 1.6
"a lot" = 1.6
"strongly" = 1.6
"way" = 1.6

[limits]
exposure = 0.75
temp = 50
tint = 100
saturation = 25
clarity = 20
contrast = 15

[target]
min_score = 0.45
min_coverage = 0.003
min_cell_coverage = 0.002

[policy]
# A target that is a kind of a protected concept obeys that concept's region policy too
# (concepts.toml: forbidden ops, caps). The head noun of a target is checked as well, so
# "blue sky" obeys the sky policy without an entry here.
face = "skin"
faces = "skin"
cheek = "skin"
cheeks = "skin"
forehead = "skin"
arm = "skin"
arms = "skin"
hand = "skin"
hands = "skin"
glacier = "snow"
ice = "snow"
cloud = "sky"
clouds = "sky"
forest = "trees"
bush = "foliage"
bushes = "foliage"
lake = "water"
river = "water"
sea = "water"
ocean = "water"
pond = "water"
waterfall = "water"
meadow = "grass"
lawn = "grass"
field = "grass"
peak = "mountain"
peaks = "mountain"
hill = "mountain"
hills = "mountain"

[marks]
# A mark is an oval the user drew (F37). A sentence that names a thing ("this guy") edits that
# thing inside the oval; any other sentence edits the oval itself, as a soft shape.
feather = 0.35               # area: the edge fades over this share of the radius
                             # (the drawn line is where the change is at half strength)
min_side = 0.01              # a mark narrower than this share of the frame is refused
min_score = 0.45             # thing: below this score the answer is not used
min_coverage = 0.0001        # thing: the smallest mask, as a share of the frame
min_cell_coverage = 0.0001   # thing: the smallest overlap with a region that is its own cell
inside_share = 0.6           # thing: less of the mask inside the box: "bigger than the mark"
guard_min_share = 0.03       # skin or snow inside a mark is its own cell from this share of it
# The sentence asks for the oval itself:
area_words = ["area", "part", "spot", "patch", "corner", "region", "zone"]
# Words that name nothing. They are dropped from a mark's name, so "give him a violet tone" names
# "him" and "turn this jacket purple" names "jacket":
pointing_words = ["thing", "one", "object", "stuff", "bit", "here", "there",
                  "circle", "oval", "mark", "selection",
                  "give", "gives", "turn", "turns", "let", "get", "change", "paint",
                  "colour", "color", "tint", "tone", "hue", "feel"]

[shapes]
# A shape layer made by an instruction is blended on its own: the oval of an area mark and a
# named place of F18. Inside it, skin and snow the run found keep their limits.
guard = true

[parser]
# Words that end one instruction and start the next, besides . , ; ! ? and a line break.
separators = ["then"]
# What joins two parts of one instruction: "brighten the jacket and the sky".
joiners = ["and", "&", "+"]
# Words that announce a target. A clause that has one but no target is not understood.
determiners = ["the", "a", "an", "my", "our", "his", "her", "their", "this", "that", "these", "those"]
# Filler words, ignored.
stop = ["make", "makes", "add", "please", "it", "its", "to", "of", "be", "is", "are", "look", "looks",
        "just", "up", "down", "in", "on", "at", "for", "bit", "little",
        "with", "light", "gradient", "graduated", "where", "comes", "from", "shines", "area", "part", "side",
        "half",
        # polite and wordy openings ("can you make the sky...", "I want the...")
        "can", "could", "would", "you", "i", "we", "want", "need", "needs", "should"]
# Words that reject the whole clause: a negation, an exclusion, or a word that turns the meaning
# around. A rejected clause is reported in the sidecar and changes nothing.
reject = ["not", "no", "don't", "dont", "never", "without", "avoid", "stop", "nor", "neither",
          "but", "except", "apart", "excluding", "besides", "unless",
          "less", "hardly", "barely", "undo", "revert", "reset", "remove",
          "instead", "rather", "than", "or", "percent", "times"]
global_words = ["global", "everything", "all", "image", "photo", "picture", "whole image",
                "whole photo", "whole picture", "frame", "whole frame", "scene"]
max_target_words = 4
max_target_chars = 40

# [translator.examples.NAME] what the small local model is shown (F20, translate_local.py): a request
# (text), the answer it should give (target, size, [edits]). The prompt also lists every verb above
# with its deltas, so the model learns the engine's units and a normal step from this file. An
# example must not repeat a sentence that is used to measure the model (scripts/data/phrasings.toml).
[translator.examples.dusky]
text = "let the hills look a bit dusky"
target = "mountain"
[translator.examples.dusky.edits]
exposure = -0.15
saturation = -6

[translator.examples.peach]
text = "a long peach coloured fade across the bottom"
target = "bottom"
size = 1.5
[translator.examples.peach.edits]
temp = 12
tint = -40

[translator.examples.pond]
text = "the pond looks too green"
target = "water"
[translator.examples.pond.edits]
tint = -40
