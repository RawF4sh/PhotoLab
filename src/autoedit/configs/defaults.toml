# AutoEdit run defaults. CLI flags override these; a --config run.toml overrides these too.

[run]
style = "natural"          # styles.toml profile: look + default concepts + brief
# genre = "landscape"      # a genre pack from genres.toml (F30, `autoedit genres list`); left out = none
intensity = 0.8
decider = "rules"          # "rules" | "llm"
emit = "baked"             # only "baked" exists (an editable XMP hand-off is not implemented)
consistency = "brightness" # "bursts": bring frames of one framing to one level and white balance (F9, opt-in)
denoise = false            # true: noise reduction on high-ISO frames, chroma first (F7, opt-in)
night_sky = false          # true: night frames keep their darkness, lose a town's glow and stuck pixels; denoise and sharpen spare the stars (F31, opt-in)
backdrop = false           # true: even out a light backdrop and take it to a set white, see [backdrop] in rules.toml (F34, opt-in)
consistency_wb = false     # true: a group of photos gets one white balance, the median cast of its frames (F34, opt-in)
colour_report = false      # true: report how far the subject colour spreads inside each group, in run.json and at the end of a run (F34, opt-in)
grain_size = 1.0           # film grain clump size, 0.5 to 4; it follows the size of the export (F23)
history = false           # true: one line per exported photo in your profile, for `autoedit style suggest` (F27, opt-in)
lut_amount = 100.0         # how much of a --lut file is blended in, 0 to 100 (F25)
# lut = "film.cube"        # a .cube 3D LUT laid over the finished photo (F25); left out = none
# grain = 25               # film grain 0..100, added to the export after the resize (F23); left out = the look's own, 0 = none
levels = false             # true: pull each frame's measured black point to a true black (F5, opt-in)
# neutral = [0.5, 0.5]     # a spot, X and Y as shares of the frame, that is grey or white: the white balance makes it neutral (F34); left out = none
# wb = [0.0, 0.0]          # the white balance [temp, tint] for every photo of the run, as --neutral-from measures it (F34); left out = the rules'
straighten = false         # true: turn the export so a clear waterline or horizon is level, at most 5 degrees; the edges are cut (F32, opt-in)
translator = "auto"        # a small local model (Ollama) reads --edit clauses the word list misses; "off" never asks (F20)
light_shaping = false      # true: a soft warm glow where the sun is, see [sun_glow] in compose.toml (F18, opt-in)
highlight_hold = false     # true: keep source-blown highlights white, see [highlight_hold] in rules.toml (F6, opt-in)
# look/preset/concepts/prompt are unset here — the style supplies look + concepts;
# override any of them per-run via CLI flags (--look, --preset, --concepts, --prompt).
# palette/palette_strength are also unset by default; set --palette cool_blue or type a
# cue such as "cool blue" in the Studio intent box for the winter-blue grade.

[segment]
backend = "stub"           # "stub" (no GPU, heuristic) | "sam3"
device = "auto"            # auto -> cuda > mps > cpu
analysis_long_edge = 1536  # segmentation/stats resolution; apply is full-res
mask_cache = true          # keep raw masks in <out>/.autoedit-masks (not for the stub) so re-renders skip SAM

[decode]
# RAW development (camera RAW only; JPEG/TIFF ignore this block). "none" = the historical libraw
# render (camera WB, no auto-bright, gamma only) — measured ~1.4–1.8 EV under the camera's own
# JPEG on real CR2s. Candidates, ranked by `scripts/raw_benchmark.py` (a benchmark never flips
# this default by itself):
#   libraw_auto          libraw's 1%-clip histogram stretch
#   linear_srgb          linear demosaic, exact sRGB encoding, no exposure normalization
#   preview_ev           lift the linear demosaic to the embedded camera preview's median
#   preview_ev_headroom  same, capped so ≤ clip_budget of pixels reach white (recommended shape)
#   tone_target          ignore the camera; put the median at tone_target_p50, headroom-capped
raw_mode = "none"
max_ev = 2.5               # never lift more than this many stops at decode
clip_budget = 0.005        # headroom cap: fraction of pixels allowed to reach white
tone_target_p50 = 0.40     # tone_target mode: median luma target (gamma-encoded)
fallback_ev = 0.0          # unavailable/incompatible preview: no camera-independent fixed lift

[output]
format = "jpeg"            # "jpeg" | "tiff" | "webp" | "png"
quality = 95               # 95 preserves the anti-banding dither in flat skies (matches the web UI)
metadata = "shareable"     # EXIF in exports: "keep" (all) | "shareable" (no GPS, no serial numbers) | "none"
# long_edge = 2048         # longest side of the export in pixels (never upscales); left out = full size
# aspect = "4:5"           # crop the export to this shape W:H, placed on the subject (F32); left out = the photo's own shape
name = "{stem}"            # file name without extension; fields {stem} {style} {n} (n takes a format: {n:04d})
subdir = ""                # subfolder of the output folder
# export = "web"           # a preset from exports.toml (full | web | social | archive | webp)

[llm]
mode = "refine"            # "refine" (bounded deltas) | "propose"
model = "claude-haiku-5-5"
temperature = 0.0          # accepted for older run files; current models reject it, so it is not sent
max_calls = 0              # 0 = unlimited; >0 caps then falls back to rules
budget_usd = 1.0           # per run; 0 = unlimited
input_usd_per_mtok = 0.10  # prices of the model, for the budget cap; update them with the model
output_usd_per_mtok = 0.50
translate_instructions = true   # --edit clauses the local parser rejects: the LLM may translate them
thumb_px = 512

[performance]
workers = 1                # render processes for a batch; 0 = half the cores, at most 4
threads = 0                # threads inside one render; 0 = one per core
