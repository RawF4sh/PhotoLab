# The things the reveal check (F21) looks for. A reveal.toml in the profile is merged over this file.
[check]
min_score = 0.5       # for a kind without its own value
min_side = 0.006      # smallest side of a finding, as a share of the frame's long edge
max_findings = 30     # per photo; the rest is counted ("and 12 more")
merge_iou = 0.5       # two findings of one kind that overlap this much are one
subject_ratio = 0.6   # in a photo of people, a person at least this large next to the largest is also "the subject"
tiles = 1             # 1 = the proxy only; 2 = also 2 x 2 tiles

# Hiding a finding, only when the user asks for its kind (--hide plate,face; the Hide control in the app). F22.
# Nothing is generated: a region is covered, made into blocks or blurred, never filled with picture content.
[hide]
method = "cover"      # cover: one flat fill in the average colour of the surroundings, nothing under the region is copied
                      # mosaic and blur look softer and keep a trace of what was there
margin = 0.1          # the hidden area is the finding grown by this share of its shorter side ...
margin_min_px = 3     # ... and by at least this many pixels of the analysis picture (a mask is a little rough)

[hide.cover]
ring = 0.25           # the surroundings are a band this wide outside the margin, as a share of the shorter side

[hide.mosaic]
blocks = 5            # blocks across the shorter side: bigger regions get bigger blocks

[hide.blur]
sigma = 0.2           # blur radius as a share of the shorter side: bigger regions get a stronger blur

[kind.plate]
label = "number plate"
words = ["license plate"]
min_score = 0.4      # measured 2026-11-17: 14 of 14, 1 false alarm in 120

[kind.address]
label = "house number or street sign"
words = ["house number", "street sign"]
weak = true          # not measured: no labelled photo had one

[kind.writing]
label = "writing"
words = ["letter"]              # finds written characters (measured), not a letter in the post
min_score = 0.4      # measured: 10 of 10, 10 false alarms in 124

[kind.screen]
label = "screen"
words = ["computer screen", "phone screen", "television"]
weak = true          # not measured: no labelled photo had one

[kind.document]
label = "document, letter or label"
words = ["document", "envelope", "whiteboard", "shipping label"]
weak = true          # not measured: no labelled photo had one

[kind.card]
label = "card or ticket"
words = ["credit card", "ID card", "ticket"]
weak = true          # not measured: no labelled photo had one

[kind.badge]
label = "name badge"
words = ["name tag"]
weak = true          # not measured: no labelled photo had one

[kind.people]
label = "person"
words = ["person"]
min_score = 0.8      # measured: 59 of 59, 6 false alarms in 75

[kind.face]
label = "face"
words = ["human face"]         # "face" alone also finds animals (measured)
min_score = 0.8      # measured: 39 of 40, 9 false alarms in 94

[kind.child]
label = "possibly a child"
words = ["child"]              # fired on distant adults in the probe; kept after T0
min_score = 0.65     # measured: 33 of 33, 9 false alarms in 101

[kind.key]
label = "key"
words = ["key"]
weak = true          # not measured: no labelled photo had one

[kind.code]
label = "barcode or QR code"
words = ["barcode", "QR code"]
weak = true          # not measured: no labelled photo had one
