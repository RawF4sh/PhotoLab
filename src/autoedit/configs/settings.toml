# AutoEdit settings: what a person sees for each run setting. The type, default and limits come
# from the code (contract.py::RunConfig); this file adds the words. A test fails when a setting is
# missing here, or described here but gone from the code.
# Order: groups as listed under [groups], settings in this file's order inside their group.

# Not for a person: config file paths, the API key (never shown) and a fixed internal value.
hidden = ["rules_path", "looks_path", "concepts_path", "styles_path", "compose_path", "intents_path",
          "palettes_path", "instructions_path", "exports_path", "reveal_path", "api_key", "emit", "profile_dir", "rule_sets"]

[groups]
look = "Look"
direct = "Directed edits"
quality = "Image quality"
batch = "Batch"
output = "Output"
raw = "RAW development"
segmentation = "Regions"
llm = "AI assistant (optional, your own key)"
performance = "Performance"

# ---- Look ----
[setting.style]
label = "Style"
group = "look"
help = "The overall look: which regions are edited and how strongly."

[setting.genre]
label = "Kind of photo"
group = "look"
help = "A pack for one kind of photography: what to find, a look and which tools are on. Your own choices win over it."

[setting.look]
label = "Look"
group = "look"
help = "Overrides how strong the edit is for this style, for example punchy or soft."

[setting.intensity]
label = "Strength"
group = "look"
help = "How much of the edit is applied: below 1 is subtler, above 1 is stronger."

[setting.palette]
label = "Colour grade"
group = "look"
help = "A colour mood such as cool blue or warm gold. Auto picks one from your words, off adds none."

[setting.palette_strength]
label = "Colour grade strength"
group = "look"
help = "How strongly the colour grade tints the photo. 0 is none, 1 is the full grade."

[setting.reference]
label = "Reference photo"
group = "look"
help = "A photo whose colours and tones the result should move toward."

[setting.reference_strength]
label = "Reference strength"
group = "look"
help = "How closely to follow the reference photo. 0 ignores it, 1 matches it fully."

[setting.grain]
label = "Grain"
group = "look"
help = "Film grain on the finished photo, 0 to 100. Empty uses the look's own; 25 is light, 100 is heavy."

[setting.grain_size]
label = "Grain size"
group = "look"
help = "How coarse the grain is. 1 is fine, 2 is twice as coarse. It follows the size of the export."

[setting.lut]
label = "LUT file"
group = "look"
help = "A .cube colour filter file laid over the finished photo. Empty uses none."

[setting.lut_amount]
label = "LUT strength"
group = "look"
help = "How much of the LUT file is blended in, 0 to 100."

# ---- Directed edits ----
[setting.prompt]
label = "Intent"
group = "direct"
help = "A few words about the mood you want, such as warm sunset or moody. It is read on your computer."

[setting.edit]
label = "Edit instructions"
group = "direct"
help = "Plain-language changes to parts of the photo, for example brighten the jacket."

# ---- Image quality ----
[setting.compose]
label = "Vignette and sky gradient"
group = "quality"
help = "Allows gentle darkened edges and sky gradients that guide the eye to the subject."

[setting.vignette]
label = "Vignette"
group = "quality"
help = "Darkens the edges slightly. Turn off for an even frame."

[setting.sharpen]
label = "Sharpen"
group = "quality"
help = "Adds a little final sharpening to the export."

[setting.highlight_hold]
label = "Keep blown highlights white"
group = "quality"
help = "Keeps areas that were pure white in the original from turning grey after the edit."

[setting.light_shaping]
label = "Glow where the sun is"
group = "quality"
help = "Adds a soft warm glow around the sun or a bright light when the photo has a clear one."

[setting.snap_edges]
label = "Fill gaps at the frame edge"
group = "quality"
help = "Extends a marked area that stops just short of the edge of the picture to the edge, so no thin unedited rim is left."

[setting.levels]
label = "Set black and white point"
group = "quality"
help = "Stretches the tones so the darkest parts are properly black and the brightest properly white."

[setting.denoise]
label = "Reduce noise"
group = "quality"
help = "Smooths grain in dark, high-ISO photos while keeping edges."

[setting.night_sky]
label = "Night sky"
group = "quality"
help = "Night photos stay dark and lose a town's glow and stuck pixels; noise reduction and sharpening spare the stars."

[setting.backdrop]
label = "Clean backdrop"
group = "quality"
help = "Evens out a light background and takes it to a clean white. Nothing is cut out; a photo without a light background is left alone."

[setting.straighten]
label = "Straighten"
group = "quality"
help = "Turns the photo so that a clear waterline or horizon is level, at most 5 degrees. The edges are cut."

[setting.neutral]
label = "Neutral spot"
group = "quality"
help = "A spot that is grey or white, X and Y as shares of the frame from the top left. The white balance makes it neutral."

[setting.wb]
label = "White balance"
group = "quality"
help = "Temp and tint for every photo, in place of the rules' own. A neutral spot measured once gives these two numbers."
advanced = true

# ---- Batch ----
[setting.consistency]
label = "Consistency"
group = "batch"
help = "Brightness evens out the shoot; bursts evens frames of one scene; timelapse evens flicker between frames in order."

[setting.consistency_wb]
label = "Same white balance"
group = "batch"
help = "Brings the photos of a group to one white balance, so the same product keeps the same colour from photo to photo."

[setting.colour_report]
label = "Colour report"
group = "batch"
help = "After the run, shows how far the colour of the subject differs inside each group of photos."

# ---- Output ----
[setting.out_format]
label = "File format"
group = "output"
help = "The file type of the finished photos."

[setting.out_long_edge]
label = "Longest side (pixels)"
group = "output"
help = "Shrinks the export so its longest side is this many pixels. Empty keeps full size."

[setting.out_name]
label = "File name"
group = "output"
help = "Name of each exported file without the ending. Use {stem} for the original name, {style} and {n}."

[setting.out_subdir]
label = "Subfolder"
group = "output"
help = "Puts the exports in a subfolder of the output folder. Empty uses the output folder itself."

[setting.export]
label = "Export preset"
group = "output"
help = "A saved bundle of output settings, such as web or print."

[setting.quality]
label = "Quality"
group = "output"
help = "Picture quality of JPEG and WebP files. Higher is sharper and bigger."

[setting.metadata]
label = "Photo information"
group = "output"
help = "What camera data stays in the export: keep all, share without location and serial numbers, or none."

[setting.out_aspect]
label = "Crop to shape"
group = "output"
help = "Crops the export to a shape such as 4:5 or 1:1, placed on the subject. Empty keeps the photo's own shape."

[setting.reveal_check]
label = "Check before sharing"
group = "output"
help = "Lists photos that show plates, screens, documents, people or file metadata. It looks only for what is on its list. It changes no picture."

[setting.history]
label = "Keep a history of your edits"
group = "output"
help = "One line per exported photo in your profile: what you changed, no picture, no file name. It never leaves this computer."

# ---- RAW development ----
[setting.raw_mode]
label = "RAW method"
group = "raw"
help = "How RAW files are brightened when opened. None keeps the standard camera-style result."
advanced = true

[setting.raw_max_ev]
label = "Largest brightening (stops)"
group = "raw"
help = "The most a RAW photo may be brightened when it is opened."
advanced = true

[setting.raw_clip_budget]
label = "Allowed white area"
group = "raw"
help = "The share of the photo that may turn pure white while brightening a RAW file."
advanced = true

[setting.raw_tone_target_p50]
label = "Target brightness"
group = "raw"
help = "The middle brightness a RAW photo is brightened toward in the tone target method."
advanced = true

[setting.raw_fallback_ev]
label = "Brightening without preview (stops)"
group = "raw"
help = "How much to brighten a RAW file that has no camera preview to compare with."
advanced = true

# ---- Regions ----
[setting.backend]
label = "Region finder"
group = "segmentation"
help = "How parts of the photo such as sky or skin are found. Stub finds none and needs no download."

[setting.concepts]
label = "Regions to edit"
group = "segmentation"
help = "Names of the parts to find and edit, such as sky or water. Empty list turns region editing off."

[setting.preset]
label = "Region set"
group = "segmentation"
help = "A ready-made list of regions, such as landscape or wedding. It replaces the style's own list."

# ---- AI assistant ----
[setting.decider]
label = "Edit method"
group = "llm"
help = "Rules is the built-in method. LLM asks your AI assistant. Learned uses a model you trained."

[setting.allow_cloud]
label = "Allow cloud assistant"
group = "llm"
help = "Gives permission to send a small preview and numbers, never the full photo, to your AI provider."

[setting.llm_mode]
label = "Assistant role"
group = "llm"
help = "Refine adjusts the built-in edit; propose lets the assistant suggest the edit itself."

[setting.llm_model]
label = "Assistant model"
group = "llm"
help = "The name of the AI model to ask."

[setting.llm_temperature]
label = "Assistant variation"
group = "llm"
help = "0 gives the same answer each time; higher values vary more."
advanced = true

[setting.llm_translate_instructions]
label = "Let the assistant read instructions"
group = "llm"
help = "Lets the assistant turn your edit instructions into changes when the built-in reader cannot."

[setting.translator]
label = "Understand free text on this computer"
group = "direct"
help = "A small model on this Mac reads edit instructions the word list does not know. Auto uses it when Ollama is running."

[setting.local_model]
label = "Local model"
group = "direct"
help = "The Ollama model that reads instructions."
advanced = true

[setting.local_url]
label = "Local model address"
group = "direct"
help = "Where Ollama listens on this computer."
advanced = true

[setting.local_timeout_s]
label = "Local model time limit (s)"
group = "direct"
help = "How long to wait for the local model before the instruction counts as not understood."
advanced = true

[setting.llm_thumb_px]
label = "Preview size (pixels)"
group = "llm"
help = "The longest side of the small preview sent to the assistant."
advanced = true

[setting.llm_max_calls]
label = "Most assistant calls"
group = "llm"
help = "Stops asking the assistant after this many photos. 0 means no limit."
advanced = true

[setting.llm_budget_usd]
label = "Spending limit (USD)"
group = "llm"
help = "Stops asking the assistant once a run has cost this much. 0 means no limit."
advanced = true

[setting.llm_input_usd_per_mtok]
label = "Price per million input tokens (USD)"
group = "llm"
help = "What your model charges for what it reads. Used only to apply the spending limit."
advanced = true

[setting.llm_output_usd_per_mtok]
label = "Price per million output tokens (USD)"
group = "llm"
help = "What your model charges for what it writes. Used only to apply the spending limit."
advanced = true

[setting.recipe_model]
label = "Trained model file"
group = "llm"
help = "The model you trained, used when the edit method is learned."
advanced = true

# ---- Performance ----
[setting.workers]
label = "Parallel photos"
group = "performance"
help = "How many photos are edited at the same time. 0 picks a sensible number for your computer."
advanced = true

[setting.threads]
label = "Threads per photo"
group = "performance"
help = "How many processor threads one photo may use. 0 uses all of them."
advanced = true

[setting.analysis_long_edge]
label = "Analysis size (pixels)"
group = "performance"
help = "The size the photo is shrunk to for analysis. Smaller is faster, larger is more exact."
advanced = true

[setting.device]
label = "Processor"
group = "performance"
help = "Which processor finds regions: auto, cpu, or a graphics card name such as cuda or mps."
advanced = true

[setting.mask_cache]
label = "Remember regions"
group = "performance"
help = "Saves the found regions so that editing the same photos again is much faster."
advanced = true
