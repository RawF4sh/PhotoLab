# Phrasings a photographer might type into an instruction box, with what a correct reading is.
# Written before any model was run on them (F20). Used by scripts/eval_translator.py.
#
#   text      the instruction, as typed
#   targets   accepted targets: a concept, "global", or "place:<name>". [] = must be left out
#             (it forbids something, or asks for nothing an edit can do)
#   ops       expected sign of each op that must move ("+" or "-"). Ops not named may move too.
#   size      optional: ">1" or "<1" for a place's size
#
# Colour conventions of the engine: tint negative = pink/magenta, positive = green;
# temp positive = warmer.

[[phrase]]
text = "make the sky have a bigger gradient for pink"
targets = ["sky", "place:top"]
ops = { tint = "-" }

[[phrase]]
text = "give the clouds a rose tint"
targets = ["cloud", "clouds", "sky"]
ops = { tint = "-" }

[[phrase]]
text = "can you make the sky a little more purple"
targets = ["sky"]
ops = { tint = "-" }

[[phrase]]
text = "I want the sunset to feel more orange"
targets = ["sunset", "sky", "global"]
ops = { temp = "+" }

[[phrase]]
text = "the grass looks too yellow, make it greener"
targets = ["grass"]
ops = { tint = "+" }

[[phrase]]
text = "the water should be more turquoise"
targets = ["water"]
ops = { temp = "-" }

[[phrase]]
text = "the whole thing feels too blue"
targets = ["global"]
ops = { temp = "+" }

[[phrase]]
text = "skin looks too red"
targets = ["skin"]
ops = { saturation = "-" }

[[phrase]]
text = "make the mountains pop more"
targets = ["mountain", "mountains"]
ops = { contrast = "+" }

[[phrase]]
text = "too dark overall"
targets = ["global"]
ops = { exposure = "+" }

[[phrase]]
text = "it's way too bright"
targets = ["global"]
ops = { exposure = "-" }

[[phrase]]
