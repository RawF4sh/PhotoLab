name: Bug report
description: Something went wrong while running AutoEdit
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AutoEdit version
      placeholder: "e.g. 0.2.0 (autoedit --help / pip show autoedit)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Linux, Windows]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12"
  - type: dropdown
    id: backend
    attributes:
      label: Segmentation backend
      options: [stub, sam3]
  - type: textarea
    id: command
    attributes:
      label: Command + what happened
      description: The full `autoedit ...` command, expected vs actual, steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output / sidecar excerpt
      description: Paste the traceback and/or the relevant `<name>.autoedit.json`. No photos needed.
      render: shell
