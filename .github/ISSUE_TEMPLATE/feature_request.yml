name: Feature request
description: Suggest an improvement (a style, a rule tweak, a workflow)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or use case?
      description: What kind of photos / shoots? What does the current output get wrong?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: Rule/style tuning (configs/*.toml)
        - label: New concept / open-vocab region
        - label: Compositional moves (radial/linear)
        - label: Adjustment vocabulary (curves, HSL, color grading)
        - label: Web UI / workflow
        - label: SAM 3 / LLM decider
